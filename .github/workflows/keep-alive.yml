name: Scheduled backend ping

# Sends best-effort traffic to the backend health endpoint. Hosted cron timing
# is not guaranteed, this endpoint does not query the database, and the job is
# intentionally non-alerting; it cannot promise an always-on service or prevent
# a database provider from pausing a project.
#
# Setup: add a repo variable named BACKEND_URL (Settings → Secrets and variables
# → Actions → Variables) = your Render URL, e.g. https://reclaim-api.onrender.com
#
# Note: GitHub may skip scheduled runs on inactive repos and cron timing is
# best-effort. Use an always-on plan and a real monitor when availability matters.

on:
  schedule:
    - cron: '*/14 * * * *' # every 14 minutes
  workflow_dispatch: {}     # allow manual runs

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: |
          URL="${{ vars.BACKEND_URL }}"
          if [ -z "$URL" ]; then
            echo "BACKEND_URL repo variable is not set — skipping."
            exit 0
          fi
          echo "Pinging $URL/api/health"
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "$URL/api/health" || echo "000")
          echo "HTTP $code"
          # This traffic helper deliberately does not fail on a timeout or
          # non-200 response. It is not an outage monitor or alerting check.
          if [ "$code" = "200" ]; then
            echo "Backend returned 200."
          else
            echo "Got $code; use independent monitoring to investigate failures."
          fi
